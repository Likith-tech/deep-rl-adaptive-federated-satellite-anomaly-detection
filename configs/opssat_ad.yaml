# Phase 9A — OPSSAT-AD real spacecraft telemetry validation configuration.
#
# IMPORTANT — read before touching sequence_length below:
#
# dataset.csv (the representation this phase uses — see
# docs/research/datasets/dataset_decision.md and the Phase 9A
# pre-integration audit for why segments.csv was NOT used) gives ONE
# fixed-width row of pre-extracted summary statistics per segment. There
# is NO per-timestep sequence dimension left in this file — the raw,
# variable-length, variable-sampling-rate telemetry that a real temporal
# window would come from is `segments.csv`, explicitly out of scope here.
#
# Consequence, stated plainly: reusing src/models/temporal_gru_attention.py
# (UNCHANGED — no fork, no modification) requires feeding it sequences of
# length 1 (one "timestep" = one segment's full feature vector). This is
# the smallest justified adaptation per the pre-integration audit's Step 7:
# it reuses the exact same model class Phase 3 uses, with NO code change,
# but the GRU's recurrence and the temporal attention mechanism do not
# meaningfully operate over more than one step. This run therefore
# validates the model's CLASSIFICATION HEAD and general architecture on
# real spacecraft-derived features — it does NOT constitute a genuine test
# of sequential/temporal modeling on OPS-SAT data (that would require
# segments.csv and is left for a future phase). See
# results/reports/opssat_ad_results.md section "Model architecture" for
# the full honest discussion.

model:
  type: gru_attention          # SAME class as Phase 3 (src/models/temporal_gru_attention.py), UNCHANGED
  input_dim: 28                 # 19 numeric + 9 one-hot channel columns — see src/satellite/preprocessing.py
  projection_dim: 32
  hidden_dim: 32
  num_gru_layers: 1
  dropout: 0.3
  output_dim: 1                 # single logit; sigmoid -> P(segment is anomalous)
  sequence_length: 1             # see note above — NOT a genuine temporal window

data:
  raw_dir: data/raw/opssat_ad
  preprocessing_artifacts_dir: results/models/opssat_preprocessing

validation:
  # Carved from the AUTHOR'S training segments (train=1) ONLY. The
  # author's test segments (train=0, 529 total) are never touched until
  # the one final evaluation — see scripts/evaluate_opssat_temporal.py.
  validation_size: 0.15          # same fraction as Phase 1/3, for comparability
  stratify: true                 # stratified by the `anomaly` label
  seed: 42

training:
  batch_size: 64                 # smaller than Phase 3's 128 — OPSSAT-AD's training portion is much smaller (1,594 segments vs 107,077 NSL-KDD records)
  learning_rate: 0.001
  optimizer: adam
  loss: bce_with_logits
  epochs: 50
  early_stopping_patience: 8
  seed: 42

notes: >
  This config is entirely independent of configs/temporal.yaml (Phase 3,
  NSL-KDD) and configs/model.yaml (Phase 2). No NSL-KDD file, scaler, or
  encoder is read or modified by this pipeline. Metrics produced under
  this config must NEVER be merged with any NSL-KDD-derived metric into
  a single number — they measure a different phenomenon (real spacecraft
  operational-anomaly detection, not terrestrial cyberattack detection).
